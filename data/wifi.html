<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình WiFi</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(23, 32, 54, 0.75);
      --bg-input: #1f293d;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --accent-success: #10b981;
      --accent-danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      border-radius: 9999px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-danger);
    }

    .dot.connected {
      background-color: var(--accent-success);
      box-shadow: 0 0 10px var(--accent-success);
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-group input {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px var(--primary-glow);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CẤU HÌNH KẾT NỐI WIFI</h1>
      <p>Nhập thông tin WiFi để thiết bị kết nối vào mạng</p>
      <div class="status-badge">
        <span id="ws-dot" class="dot"></span>
        <span id="ws-status">Đang kết nối...</span>
      </div>
    </header>

    <div class="form-card">
      <form id="wifi-form">
        <div class="input-group">
          <label for="ssid">Tên WiFi (SSID)</label>
          <input type="text" id="ssid" placeholder="Nhập tên mạng WiFi" required>
        </div>

        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu WiFi">
        </div>

        <button type="submit" class="btn" id="btn-submit">Lưu & Kết Nối</button>
      </form>
    </div>
  </div>

  <script>
    const gateway = `ws://${window.location.host}/ws`;
    let websocket;

    window.addEventListener('load', () => {
      initWebSocket();
      initForm();
    });

    function initWebSocket() {
      websocket = new WebSocket(gateway);
      websocket.onopen = () => updateStatus(true);
      websocket.onclose = () => {
        updateStatus(false);
        setTimeout(initWebSocket, 2000);
      };
      websocket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.page === 'setting_saved') {
            alert('Đã lưu WiFi thành công! ESP32 đang khởi động lại...');
          }
        } catch (e) {
          console.error("Lỗi parse JSON:", e);
        }
      };
    }

    function updateStatus(connected) {
      const dot = document.getElementById('ws-dot');
      const text = document.getElementById('ws-status');
      if (dot && text) {
        dot.className = connected ? 'dot connected' : 'dot';
        text.innerText = connected ? 'Trực tuyến' : 'Mất kết nối';
      }
    }

    function initForm() {
      const form = document.getElementById('wifi-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const ssid = document.getElementById('ssid').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn = document.getElementById('btn-submit');

        const payload = {
          page: "setting",
          value: {
            ssid: ssid,
            password: password,
            token: "",
            server: "",
            port: ""
          }
        };

        if (websocket && websocket.readyState === WebSocket.OPEN) {
          websocket.send(JSON.stringify(payload));
          btn.innerText = 'Đang lưu cấu hình...';
          btn.disabled = true;
        } else {
          alert('Chưa kết nối được với ESP32 qua WebSocket!');
        }
      });
    }
  </script>
</body>
</html>
